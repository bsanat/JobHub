name: Apply Telegram import guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && vars.PUBLIC_IMPORT_PRODUCTION_PERMISSIONS_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.PUBLIC_IMPORT_DATABASE_URL }}
      PUBLIC_IMPORT_DATABASE_HOST: ${{ vars.PUBLIC_IMPORT_DATABASE_HOST }}
      PUBLIC_IMPORT_DATABASE_USER: ${{ vars.PUBLIC_IMPORT_DATABASE_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Apply reviewed trigger function
        working-directory: backend
        run: go run ./cmd/apply-telegram-import-guard --sql ../scripts/supabase-telegram-import-guard.sql
