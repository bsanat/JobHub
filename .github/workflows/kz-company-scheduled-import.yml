name: Scheduled Kazakhstan company imports

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kz-company-imports-production
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main' && vars.KZ_IMPORT_AUTO_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: production
      KZ_IMPORT_TARGET: production
      KZ_IMPORT_WRITE_ENABLED: 'true'
      KZ_IMPORT_PRODUCTION_PERMISSIONS_CONFIRMED: ${{ vars.KZ_IMPORT_PRODUCTION_PERMISSIONS_CONFIRMED }}
      KZ_IMPORT_ENABLED: ${{ vars.KZ_IMPORT_ENABLED }}
      KZ_IMPORT_AUTO_SOURCES: ${{ vars.KZ_IMPORT_AUTO_SOURCES }}
      KZ_IMPORT_DATABASE_HOST: ${{ vars.PUBLIC_IMPORT_DATABASE_HOST }}
      KZ_IMPORT_DATABASE_USER: ${{ vars.PUBLIC_IMPORT_DATABASE_USER }}
      DATABASE_URL: ${{ secrets.PUBLIC_IMPORT_DATABASE_URL }}
      PGX_QUERY_EXEC_MODE: exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate inspected Production target and source allowlist
        run: |
          test "$KZ_IMPORT_ENABLED" = 'true' || { echo 'Kazakhstan import is disabled'; exit 1; }
          test "$KZ_IMPORT_PRODUCTION_PERMISSIONS_CONFIRMED" = 'true' || { echo 'Production permission review is incomplete'; exit 1; }
          test -n "$DATABASE_URL" || { echo 'Missing Production database secret'; exit 1; }
          test -n "$KZ_IMPORT_DATABASE_HOST" || { echo 'Missing inspected database host'; exit 1; }
          test -n "$KZ_IMPORT_DATABASE_USER" || { echo 'Missing inspected database user'; exit 1; }
          test -n "$KZ_IMPORT_AUTO_SOURCES" || { echo 'No scheduled sources selected'; exit 1; }
          python3 - <<'PY'
          import json, os
          with open('backend/config/kz-company-sources.json', encoding='utf-8') as handle:
              config = json.load(handle)
          selected = os.environ['KZ_IMPORT_AUTO_SOURCES'].split(',')
          if not selected or len(selected) != len(set(selected)):
              raise SystemExit('Invalid scheduled source list')
          by_id = {source['id']: source for source in config['sources']}
          for source_id in selected:
              source = by_id.get(source_id)
              if not source or source['status'] != 'supported' or not source.get('robots_reviewed') or not source.get('adapter'):
                  raise SystemExit('Scheduled source lacks a reviewed adapter')
          PY
      - name: Build one-shot import commands
        working-directory: backend
        run: |
          go build -o "$RUNNER_TEMP/kz-company-import" ./cmd/import-kz-company-jobs
          go build -o "$RUNNER_TEMP/kz-company-reconcile" ./cmd/reconcile-kz-legacy-duplicates
      - name: Synchronize approved company sources
        working-directory: backend
        run: |
          umask 077
          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT
          export CONFIG_DIR="$config_dir"
          python3 - <<'PY'
          import json, os
          with open('config/kz-company-sources.json', encoding='utf-8') as handle:
              base = json.load(handle)
          for source_id in os.environ['KZ_IMPORT_AUTO_SOURCES'].split(','):
              config = json.loads(json.dumps(base))
              config['enabled'] = True
              for source in config['sources']:
                  source['enabled'] = source['id'] == source_id
                  source['permissions_confirmed'] = source['enabled']
              with open(os.path.join(os.environ['CONFIG_DIR'], source_id + '.json'), 'w', encoding='utf-8') as handle:
                  json.dump(config, handle)
          PY
          failures=0
          old_ifs="$IFS"
          IFS=,
          for source_id in $KZ_IMPORT_AUTO_SOURCES; do
            IFS="$old_ifs"
            if "$RUNNER_TEMP/kz-company-import" --config "$config_dir/$source_id.json" --source "$source_id" --once --activate; then
              case "$source_id" in
                airastana|kcell)
                  "$RUNNER_TEMP/kz-company-reconcile" --source "$source_id" --once || failures=1
                  ;;
              esac
            else
              failures=1
            fi
            IFS=,
          done
          IFS="$old_ifs"
          exit "$failures"
      - name: Publish newly imported vacancies
        if: ${{ success() && vars.TELEGRAM_PUBLISHER_ENABLED == 'true' }}
        working-directory: backend
        env:
          FRONTEND_ORIGIN: https://jobhub-lovat.vercel.app
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ vars.TELEGRAM_PUBLIC_CHANNEL_ID }}
          TELEGRAM_PUBLIC_CHANNEL_USERNAME: ${{ vars.TELEGRAM_PUBLIC_CHANNEL_USERNAME }}
          TELEGRAM_PUBLISHER_ENABLED: 'true'
          TELEGRAM_PUBLISH_BATCH_SIZE: '15'
          JOBHUB_PUBLIC_BASE_URL: https://jobhub-lovat.vercel.app
        run: go run ./cmd/telegram-publisher --once
