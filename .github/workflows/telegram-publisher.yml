name: Telegram vacancy publisher

on:
  schedule:
    - cron: '7/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-publisher-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.PUBLIC_IMPORT_DATABASE_URL }}
      PUBLIC_IMPORT_DATABASE_HOST: ${{ vars.PUBLIC_IMPORT_DATABASE_HOST }}
      PUBLIC_IMPORT_DATABASE_USER: ${{ vars.PUBLIC_IMPORT_DATABASE_USER }}
      PGX_QUERY_EXEC_MODE: exec
      FRONTEND_ORIGIN: https://jobhub-lovat.vercel.app
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${{ vars.TELEGRAM_PUBLIC_CHANNEL_ID }}
      TELEGRAM_PUBLIC_CHANNEL_USERNAME: ${{ vars.TELEGRAM_PUBLIC_CHANNEL_USERNAME }}
      TELEGRAM_PUBLISHER_ENABLED: 'true'
      TELEGRAM_PUBLISH_AFTER: ${{ vars.TELEGRAM_PUBLISH_AFTER }}
      TELEGRAM_PUBLISHER_DRY_RUN: 'false'
      TELEGRAM_PUBLISH_BATCH_SIZE: '15'
      TELEGRAM_PUBLISH_TEST_SOURCES: 'false'
      TELEGRAM_PUBLISH_WITHOUT_LINK: 'false'
      JOBHUB_PUBLIC_BASE_URL: https://jobhub-lovat.vercel.app
    steps:
      - name: Check publisher gate
        id: gate
        env:
          PUBLISHER_SWITCH: ${{ vars.TELEGRAM_PUBLISHER_ENABLED }}
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ]; then
            echo 'Publisher disabled: this run is not on main'
            exit 0
          fi
          if [ "$PUBLISHER_SWITCH" != 'true' ]; then
            echo 'Publisher disabled: TELEGRAM_PUBLISHER_ENABLED is not true'
            exit 0
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo 'Publisher gate open'
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-go@v5
        if: steps.gate.outputs.run == 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate configuration
        if: steps.gate.outputs.run == 'true'
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing PUBLIC_IMPORT_DATABASE_URL secret'; exit 1; }
          test -n "$PUBLIC_IMPORT_DATABASE_HOST" || { echo 'Missing PUBLIC_IMPORT_DATABASE_HOST variable'; exit 1; }
          test -n "$PUBLIC_IMPORT_DATABASE_USER" || { echo 'Missing PUBLIC_IMPORT_DATABASE_USER variable'; exit 1; }
          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'Missing TELEGRAM_BOT_TOKEN secret'; exit 1; }
          test -n "$TELEGRAM_PUBLIC_CHANNEL_ID" || { echo 'Missing TELEGRAM_PUBLIC_CHANNEL_ID variable'; exit 1; }
          test -n "$TELEGRAM_PUBLIC_CHANNEL_USERNAME" || { echo 'Missing TELEGRAM_PUBLIC_CHANNEL_USERNAME variable'; exit 1; }
          test -n "$TELEGRAM_PUBLISH_AFTER" || { echo 'Missing TELEGRAM_PUBLISH_AFTER variable'; exit 1; }
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit

          parsed = urlsplit(os.environ['DATABASE_URL'])
          if (parsed.scheme not in ('postgres', 'postgresql') or
              parsed.hostname != os.environ['PUBLIC_IMPORT_DATABASE_HOST'] or
              parsed.username != os.environ['PUBLIC_IMPORT_DATABASE_USER']):
              raise SystemExit('Production database identity check failed')
          PY
      - name: Publish one batch
        if: steps.gate.outputs.run == 'true'
        working-directory: backend
        run: go run ./cmd/telegram-publisher --once
