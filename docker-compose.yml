services:
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    profiles: ["local"]
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=public", "up"]
    restart: "no"
  backend-local:
    profiles: ["local"]
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=public
      DATABASE_MIGRATION_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=public
      PGX_QUERY_EXEC_MODE: ${PGX_QUERY_EXEC_MODE:-cache_statement}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      RESUME_STORAGE_DIR: /var/lib/jobhub/resumes
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${TELEGRAM_PUBLIC_CHANNEL_ID:-}
      TELEGRAM_PUBLIC_CHANNEL_USERNAME: ${TELEGRAM_PUBLIC_CHANNEL_USERNAME:-}
      TELEGRAM_PUBLISHER_ENABLED: ${TELEGRAM_LOCAL_PUBLISHER_ENABLED:-false}
      TELEGRAM_PUBLISHER_DRY_RUN: ${TELEGRAM_PUBLISHER_DRY_RUN:-false}
      TELEGRAM_PUBLISH_WITHOUT_LINK: ${TELEGRAM_PUBLISH_WITHOUT_LINK:-false}
      TELEGRAM_PUBLISH_TEST_SOURCES: ${TELEGRAM_PUBLISH_TEST_SOURCES:-false}
      TELEGRAM_PUBLISH_TEST_CHANNEL_ID: ${TELEGRAM_PUBLISH_TEST_CHANNEL_ID:-}
      TELEGRAM_PUBLISH_INTERVAL: ${TELEGRAM_PUBLISH_INTERVAL:-60s}
      TELEGRAM_PUBLISH_BATCH_SIZE: ${TELEGRAM_PUBLISH_BATCH_SIZE:-10}
      TELEGRAM_PUBLISH_MAX_ATTEMPTS: ${TELEGRAM_PUBLISH_MAX_ATTEMPTS:-3}
      JOBHUB_PUBLIC_BASE_URL: ${JOBHUB_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - resume_data:/var/lib/jobhub/resumes
  backend:
    profiles: ["external"]
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-staging}
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the external PostgreSQL connection string}
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:-${DATABASE_URL}}
      PGX_QUERY_EXEC_MODE: ${PGX_QUERY_EXEC_MODE:-cache_statement}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      RESUME_STORAGE_DIR: /var/lib/jobhub/resumes
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PUBLIC_CHANNEL_ID: ${TELEGRAM_PUBLIC_CHANNEL_ID:-}
      TELEGRAM_PUBLIC_CHANNEL_USERNAME: ${TELEGRAM_PUBLIC_CHANNEL_USERNAME:-}
      TELEGRAM_PUBLISHER_ENABLED: ${TELEGRAM_PUBLISHER_ENABLED:-false}
      TELEGRAM_PUBLISHER_DRY_RUN: ${TELEGRAM_PUBLISHER_DRY_RUN:-false}
      TELEGRAM_PUBLISH_WITHOUT_LINK: ${TELEGRAM_PUBLISH_WITHOUT_LINK:-false}
      TELEGRAM_PUBLISH_TEST_SOURCES: ${TELEGRAM_PUBLISH_TEST_SOURCES:-false}
      TELEGRAM_PUBLISH_TEST_CHANNEL_ID: ${TELEGRAM_PUBLISH_TEST_CHANNEL_ID:-}
      TELEGRAM_PUBLISH_INTERVAL: ${TELEGRAM_PUBLISH_INTERVAL:-60s}
      TELEGRAM_PUBLISH_BATCH_SIZE: ${TELEGRAM_PUBLISH_BATCH_SIZE:-10}
      TELEGRAM_PUBLISH_MAX_ATTEMPTS: ${TELEGRAM_PUBLISH_MAX_ATTEMPTS:-3}
      JOBHUB_PUBLIC_BASE_URL: ${JOBHUB_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    volumes:
      - resume_data:/var/lib/jobhub/resumes
volumes:
  postgres_data:
  resume_data:
